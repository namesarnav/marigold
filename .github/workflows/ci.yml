name: CI

on:
  pull_request:
    branches: [main]
  # Called by deploy.yml, which is what runs these on main. Deliberately no
  # `push` trigger: with one, every merge ran this suite twice — once here and
  # once through deploy.yml — for identical results.
  workflow_call:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest

    services:
      # The suite runs against the engine it is actually deployed on, not just
      # SQLite. SQLite is permissive in ways Postgres is not — it does not
      # enforce foreign keys by default and is lax about types — so a
      # SQLite-only suite cannot tell you the app works in production.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marigold
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: marigold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marigold"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Run tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://marigold:testpass@localhost:5432/marigold_test
        run: pytest backend/ -q

      - name: Migrations must be reversible and match the models
        env:
          DATABASE_URL: postgresql+psycopg://marigold:testpass@localhost:5432/marigold_test
          SECRET_KEY: ci-secret
          GEMINI_API_KEY: ci-fake
        run: |
          set -euo pipefail
          # Start clean: the test run above left tables behind.
          psql "postgresql://marigold:testpass@localhost:5432/marigold_test" \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

          # A non-empty autogenerate means a model changed without a migration,
          # which would deploy an init container that succeeds against the wrong
          # schema. Catching it here is the whole point.
          alembic revision --autogenerate -m drift-check
          if grep -qE '^\s+op\.' backend/migrations/versions/*drift-check*.py; then
            echo "::error::Models have drifted from migrations. Generate one with 'alembic revision --autogenerate'."
            cat backend/migrations/versions/*drift-check*.py
            exit 1
          fi
          echo "No schema drift."

  ml:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      # ml/ is deliberately self-contained with its own requirements so it can
      # be containerised independently of the API.
      - run: pip install -r ml/requirements.txt

      # -m "not slow" skips the tests that download a sentence-transformers
      # model or train a network; those are run deliberately, not on every push.
      - run: pytest ml/ -q -m "not slow"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # There is no frontend test suite; the build is the check. It catches
      # import errors and syntax problems that would otherwise ship.
      - run: npm run build
        working-directory: frontend
