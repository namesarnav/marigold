# Nightly logical backup of Postgres to S3.
#
# This is not belt-and-braces, it is the only durability mechanism in the
# design. The database lives on the node's root EBS volume, and
# infra/compute.tf sets `ignore_changes = [ami, user_data]` precisely because
# replacing the instance would destroy it. If the node is lost, this dump is
# what the database is restored from.
#
# The pod needs no AWS credentials: it inherits the node's instance profile via
# IMDS, and infra/iam.tf grants that role s3:PutObject on the artifacts bucket.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  # 03:17 UTC. Off the hour on purpose — everything in the world runs at :00,
  # and this shares a burstable CPU with the app.
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A backup that hangs must not block tomorrow's.
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # Needs both pg_dump and the AWS CLI, and no public image has both.
              #
              # TRADEOFF, stated plainly: aws-cli is installed at runtime from
              # the Alpine package repo, so this job depends on that repo being
              # reachable at 03:17 every night. The alternative — building and
              # pushing a dedicated backup image to ECR — removes that
              # dependency but adds a second image to build, scan and store.
              # The retry (backoffLimit: 2) covers a transient failure; a
              # sustained apk outage would mean missed backups, which is why
              # `kubectl -n marigold get jobs` is worth actually looking at.
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  apk add --no-cache aws-cli >/dev/null
                  STAMP="$(date -u +%Y/%m/%d/marigold-%Y%m%dT%H%M%SZ)"
                  echo "dumping to s3://$ARTIFACTS_BUCKET/backups/$STAMP.dump.gz"
                  # Custom format (-Fc) so pg_restore can do selective restores
                  # and parallelism; plain SQL would give up both.
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc \
                    | gzip -9 \
                    | aws s3 cp - "s3://$ARTIFACTS_BUCKET/backups/$STAMP.dump.gz" \
                        --expected-size 1073741824
                  echo "backup complete"
              env:
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: marigold-secrets, key: POSTGRES_USER } }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: marigold-secrets, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: marigold-secrets, key: POSTGRES_DB } }
                - name: ARTIFACTS_BUCKET
                  valueFrom: { configMapKeyRef: { name: marigold-config, key: ARTIFACTS_BUCKET } }
                - name: AWS_REGION
                  valueFrom: { configMapKeyRef: { name: marigold-config, key: AWS_REGION } }
              resources:
                requests: { memory: 64Mi, cpu: 50m }
                limits: { memory: 256Mi }
