# Let's Encrypt, solved over HTTP-01 through the Traefik ingress. HTTP-01 is
# chosen over DNS-01 because it needs no Route53 credentials in the cluster —
# the security group already allows :80 from anywhere, which is what the
# challenge requires.
#
# Note the ClusterIssuer is cluster-scoped, so it is applied once and shared;
# it is listed in kustomization.yaml but carries no namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL_PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
