# Local development stack: Postgres, Redis and the API.
#
# This is the dev environment. Production is Railway, which builds the same
# Dockerfile — see the Deployment section of the README. The two are
# deliberately not the same thing: for this project the useful properties of a
# dev environment (fast feedback, real Postgres, throwaway data) are all
# available locally, and a second hosted environment costs money to keep warm.
#
# What this does NOT exercise, and where the difference bites: this targets the
# `backend` stage, so it never builds or serves the frontend bundle, and it
# does not run the entrypoint's `alembic upgrade head`-then-serve sequence.
# It also skips TLS, real SES delivery, and the Secure cookie flag. To exercise
# the image Railway actually runs, build and run the default target instead:
#
#   docker build -t marigold .
#   docker run --rm -p 8000:8000 --env-file .env marigold
#
#   docker compose up -d          start Postgres, Redis and the API
#   docker compose logs -f api    follow the API logs
#   docker compose down -v        stop and delete the data volume
#
# The Vite dev server is not containerised — run it on the host with
# `cd frontend && npm run dev`. It talks to this API on :8000 (see
# frontend/src/api.js) and hot reload works properly that way.

name: marigold-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marigold
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: marigold
    ports:
      # Published on 55432, not 5432, so this never collides with a Postgres
      # already running on the host.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marigold -d marigold"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Matches the production args so rate limiting behaves the same way here.
    command: ["--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      # The API-only image. The frontend is a separate service now, so there is
      # no npm build in this one at all and a rebuild is seconds.
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://marigold:devpass@postgres:5432/marigold
      REDIS_URL: redis://redis:6379/0

      # Dev-only values. Production takes these from Railway's service
      # variables — nothing here is a real credential.
      SECRET_KEY: dev-only-not-a-real-secret-key
      # The one thing you must supply. Export it in your shell or put it in a
      # .env file next to this one; card generation fails without it, though
      # everything else (auth, quizzes, the interaction log) works fine.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-unset}

      # The Vite dev server calls the API cross-origin. The `web` profile does
      # not need an entry: nginx proxies /api, so its requests are same-origin.
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:5173
      BACKEND_BASE_URL: http://localhost:8000

      # Plain HTTP locally, so the session cookie must not be Secure-only or the
      # browser will refuse to send it back.
      COOKIE_SECURE: "false"
      # Verification and reset emails are printed to the log instead of sent.
      # Read the link out of `docker compose logs api`.
      EMAIL_BACKEND: console

      # The verification gate, off for local development only.
      #
      # With EMAIL_BACKEND=console the only copy of a verification link is in
      # the server log, so leaving the gate on means every test account has to
      # be confirmed by grepping the log before the app does anything. Off, a
      # fresh signup can upload, study and take quizzes immediately.
      #
      # This does not mark anyone verified — `email_verified` still tracks
      # reality, it is just not enforced — so removing this line puts every
      # account straight back behind the gate. The setting defaults to true, so
      # nothing but this file turns it off; deployments keep the gate unless
      # they opt out on purpose.
      REQUIRE_EMAIL_VERIFICATION: "false"

      # OAuth. Empty by default, and the sign-in buttons render from
      # /api/auth/oauth/providers — which lists only the providers that have
      # credentials — so with nothing set here the login page shows no buttons
      # at all. That is deliberate (a button that 503s on click is worse), but
      # it does mean "the Google button is missing" is a configuration state,
      # not a bug.
      #
      # To turn it on, put these in a .env file next to this one and register
      # http://localhost:8000/api/auth/oauth/google/callback
      # as an authorised redirect URI in the Google console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      # Source is mounted so --reload picks up edits without a rebuild. Only
      # rebuild when backend/requirements.txt changes.
      - ./backend:/app/backend:ro
      - ./alembic.ini:/app/alembic.ini:ro
    # Migrations run on every start. They are idempotent, and this is what keeps
    # a dev database in step with the models after pulling someone's branch.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  # The frontend as it is actually deployed: built bundle behind nginx, with
  # /api proxied to the api service. Behind a profile because it costs an npm
  # build and day-to-day development uses the Vite dev server on the host.
  #
  #   docker compose --profile web up -d --build     then open localhost:8081
  #
  # Same shape as Railway: the browser talks only to nginx, and nginx forwards
  # /api over the compose network, so this exercises the real proxy config.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["web"]
    depends_on:
      - api
    environment:
      PORT: 8080
      # Runtime, not build time: nginx reads it at container start.
      BACKEND_URL: http://api:8000
    ports:
      - "8081:8080"

volumes:
  pgdata:
